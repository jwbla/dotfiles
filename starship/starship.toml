# generated by theme/gen.py from theme/tokens.json; do not edit
#
# The powerline ribbon retuned from Catppuccin to the @rgtv/neu brand sweep:
# deep violet -> violet -> magenta -> teal. Each segment's ink is picked by the
# design system's own onAccent() rule (src/themes.ts), which is why the
# #8b2fe0 segment takes pure white -- the themed #cdd6f4 only reaches 4.06:1
# there, under the AA floor.
#
# To back just the prompt out without touching anything else:
#     palette = 'catppuccin_mocha'

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](ramp1)\
$os\
$username\
$hostname\
[](bg:ramp2 fg:ramp1)\
$directory\
[](bg:ramp3 fg:ramp2)\
$git_branch\
$git_status\
[](fg:ramp3 bg:ramp4)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:ramp4 bg:ramp5)\
${custom.tasks}\
${custom.timew}\
$docker_context\
[](fg:ramp5 bg:ramp6)\
$time\
[](fg:ramp6)\
$cmd_duration\
$line_break\
$character"""

palette = 'neu'

[os]
disabled = false
style = "bg:ramp1 fg:ink1"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:ramp1 fg:ink1"
style_root = "bg:ramp1 fg:error"
format = '[ $user]($style)'

[hostname]
ssh_only = true
style = "bg:ramp1 fg:ink1"
format = '[ $ssh_symbol on $hostname]($style)'
trim_at = '.companyname.com'
disabled = false

[directory]
style = "bg:ramp2 fg:ink2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "
"Home" = ""
"~" = ""

[git_branch]
symbol = ""
style = "bg:ramp3"
format = '[[ $symbol $branch ](fg:ink3 bg:ramp3)]($style)'

[git_status]
style = "bg:ramp3"
format = '[[($all_status$ahead_behind )](fg:ink3 bg:ramp3)]($style)'

[nodejs]
symbol = ""
style = "bg:ramp4"
format = '[[ $symbol( $version) ](fg:ink4 bg:ramp4)]($style)'

[c]
symbol = " "
style = "bg:ramp4"
format = '[[ $symbol( $version) ](fg:ink4 bg:ramp4)]($style)'

[rust]
symbol = ""
style = "bg:ramp4"
format = '[[ $symbol( $version) ](fg:ink4 bg:ramp4)]($style)'

[golang]
symbol = ""
style = "bg:ramp4"
format = '[[ $symbol( $version) ](fg:ink4 bg:ramp4)]($style)'

[php]
symbol = ""
style = "bg:ramp4"
format = '[[ $symbol( $version) ](fg:ink4 bg:ramp4)]($style)'

[java]
symbol = " "
style = "bg:ramp4"
format = '[[ $symbol( $version) ](fg:ink4 bg:ramp4)]($style)'

[kotlin]
symbol = ""
style = "bg:ramp4"
format = '[[ $symbol( $version) ](fg:ink4 bg:ramp4)]($style)'

[haskell]
symbol = ""
style = "bg:ramp4"
format = '[[ $symbol( $version) ](fg:ink4 bg:ramp4)]($style)'

[python]
symbol = ""
style = "bg:ramp4"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:ink4 bg:ramp4)]($style)'

[docker_context]
symbol = ""
style = "bg:ramp5"
format = '[[ $symbol( $context) ](fg:ink5 bg:ramp5)]($style)'

[custom.tasks]
command = "task due.before:+24h status:pending count 2>/dev/null"
when = "[ $(task due.before:+24h status:pending count 2>/dev/null) -gt 0 ]"
symbol = "󰄲 "
style = "fg:ink5 bg:ramp5"
format = '[ $symbol$output ]($style)'
shell = ["bash", "--noprofile", "--norc"]

# The symbol here was an empty string on disk -- a nerd glyph that got lost in a
# previous edit. Restored by codepoint (U+F017, clock).
[custom.timew]
command = "timew get dom.active.tag.1 2>/dev/null"
when = "[ $(timew get dom.active 2>/dev/null) = 1 ]"
symbol = " "
style = "fg:ink5 bg:ramp5"
format = '[ $symbol$output ]($style)'
shell = ["bash", "--noprofile", "--norc"]

[time]
disabled = false
time_format = "%R"
style = "bg:ramp6"
format = '[[  $time ](fg:ink6 bg:ramp6)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:success)'
error_symbol = '[❯](bold fg:error)'
vimcmd_symbol = '[❮](bold fg:success)'
vimcmd_replace_one_symbol = '[❮](bold fg:accent)'
vimcmd_replace_symbol = '[❮](bold fg:accent)'
vimcmd_visual_symbol = '[❮](bold fg:warning)'

[cmd_duration]
show_milliseconds = true
format = "  in $duration "
style = "fg:dim"
disabled = false
show_notifications = false
min_time_to_notify = 45000

# The brand sweep. ink* are computed, not chosen -- see the header.
[palettes.neu]
ramp1 = "#3a0f63"
ramp2 = "#54198a"
ramp3 = "#8b2fe0"
ramp4 = "#9b58e7"
ramp5 = "#ff2e9a"
ramp6 = "#15cdc3"
ink1 = "#cdd6f4"
ink2 = "#cdd6f4"
ink3 = "#ffffff"
ink4 = "#000000"
ink5 = "#11111b"
ink6 = "#11111b"
accent = "#8b2fe0"
accent2 = "#ff2e9a"
accent3 = "#15cdc3"
text = "#cccccc"
muted = "#999999"
dim = "#888888"
success = "#a6e3a1"
error = "#f38ba8"
warning = "#fab387"
info = "#89b4fa"

# Kept so `palette = 'catppuccin_mocha'` above is a one-line prompt-only revert.
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
