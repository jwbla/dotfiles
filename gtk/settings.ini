# Adopted into the dotfiles repo by the neu theme port.
# install.sh moved any pre-existing file here to settings.ini.predotfiles.
[Settings]
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=breeze-dark
gtk-font-name=Adwaita Sans 11
gtk-cursor-theme-name=neu
gtk-cursor-theme-size=36
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
