# The generated neu wallpaper. It is the NeuOS desktop background from
# demos6.stories.tsx -- an accent radial bloom at 15% 0% over the ground, with a
# tertiary bloom at the far corner -- so the wallpaper re-themes with the tokens
# instead of drifting from them. Regenerate with `python3 theme/gen.py`.
#
# The previous wallpaper (~/Pictures/purp_green.jpg) is untouched; reverting this
# file is enough to get it back.
splash = false

preload = ~/dev/dotfiles/theme/wall/neu-1920x1080.png

wallpaper {
    monitor = eDP-1
    path = ~/dev/dotfiles/theme/wall/neu-1920x1080.png
}
wallpaper {
    monitor = HDMI-A-1
    path = ~/dev/dotfiles/theme/wall/neu-1920x1080.png
}
