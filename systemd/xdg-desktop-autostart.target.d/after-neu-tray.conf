# Hold XDG autostart until the shell's tray watcher is on the bus.
#
# Without this the target fires as soon as the graphical session is up, which is
# a second or two before quickshell claims org.kde.StatusNotifierWatcher -- and
# an autostart app that only offers its tray icon once (Enpass) loses the race
# and shows nothing for the whole session. Applies to every autostart entry, not
# just the one that exposed it.
[Unit]
Wants=neu-tray-ready.service
After=neu-tray-ready.service
