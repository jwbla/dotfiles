# Atuin client config — symlinked to ~/.config/atuin/config.toml by install.sh.
# Full reference: https://docs.atuin.sh/configuration/config/
#
# Only options that deviate from the default (or that are worth knowing about)
# are uncommented. Everything else is left at atuin's default on purpose.

# ------------------------------
# Sync
# ------------------------------
# The self-hosted server exists now (jwbla-infra ROADMAP.md M5, VMID 114,
# 192.168.1.114 — live 2026-09-04), but sync_address is deliberately left
# UNSET here rather than pointed at it directly: zshrc's shell init probes
# the fleet server (atuin.h.jwbla.com, then the IP, ≤300ms) on every shell
# start and exports ATUIN_SYNC_ADDRESS, which atuin reads in preference to
# this file's sync_address. A static value here would be wrong on any
# machine, or any moment, the fleet server can't be reached — this LAN-only
# box has no uptime guarantee and there's no VPN (wg, 113) yet for off-LAN
# access. See ~/dev/dotfiles/zshrc/.zshrc, the block right before
# `atuin init zsh`.
#
# The operator's own account is not created by this file or by the server's
# installer — that first `atuin register` is a manual, deliberate step (see
# jwbla-infra/services/atuin/README.md). Until it's done, sync is local-only
# regardless of which address gets probed:
#   atuin register -u <user> -e <email> --host http://192.168.1.114:8888
#   atuin sync
# NOTE: sync is E2E encrypted with ~/.local/share/atuin/key. That key already
# exists here — it was generated locally, because [dotfiles] below needs it
# even with sync off (see the caveat there). It is NOT recoverable from the
# server, so back it up before syncing anywhere.
auto_sync = false

# pacman owns the atuin version on this box; don't nag about upstream releases.
update_check = false

# ------------------------------
# UI
# ------------------------------
style = "compact"
inline_height = 20
show_preview = true

# Enter runs the selected command immediately; Tab puts it on the line to edit.
# This is atuin's default and it keeps "Up, Enter" = rerun last command working.
# Set to false if you'd rather every selection land on the prompt for review.
enter_accept = true

# ------------------------------
# History hygiene — prevention
# ------------------------------
# Commands matching any of these regexes are NEVER written to history.
# Unanchored, so use ^ and $ to match a whole command.
#
# After editing this list, retroactively clean already-recorded entries:
#   atuin history prune --dry-run    # preview
#   atuin history prune              # commit
history_filter = [
  # Single-char aliases and other pure noise (see zshrc "Aliases: Misc").
  "^c$",            # clear
  "^x$",            # exit
  "^q$",            # exit
  "^l$",            # eza listing
  "^n$",            # nvim .
  "^t$",            # tmux picker
  "^clear$",
  "^exit$",
  "^pwd$",
  "^ls$",           # bare ls only — "ls -la" is still recorded
  "^cd$",
  "^cd \\.\\.$",
  # Credentials that atuin's built-in secrets_filter doesn't already catch.
  "--password",
  "--token[= ]",
]

# Commands run from these directories are never recorded.
# cwd_filter = [
#   "^/tmp",
#   "/node_modules/",
# ]

# Built-in regexes for AWS keys, GitHub PATs, Slack tokens/webhooks, Stripe
# keys, etc. On by default — listed here so it's visible, not to change it.
secrets_filter = true

# A command typed with a leading space is not recorded (zsh hist_ignore_space
# is already set in .zshrc, and atuin honors the same convention).

# ------------------------------
# History hygiene — preservation
# ------------------------------
# Atuin has no "pin this entry" flag: history is disposable by design, and
# every delete is query-scoped (`atuin search --delete` refuses to run without
# a query). Commands you want to keep FOREVER belong in one of two places:
#
#   1. This dotfiles repo (zshrc/.zshrc, zshrc/git-aliases.zsh) — version
#      controlled, reviewable, portable. Prefer this.
#   2. Atuin's own alias store, below — survives every prune/delete because it
#      is not history, and rides along with sync if that's ever enabled:
#        atuin dotfiles alias set deploy 'long command here'
#        atuin dotfiles alias list
#
# Caveat 1: atuin init runs last in .zshrc, so an alias defined here SHADOWS a
# same-named alias from zshrc. Keep the two sets disjoint.
#
# Caveat 2: the alias store is encrypted, so enabled = true makes EVERY
# `atuin init zsh` load ~/.local/share/atuin/key. If that file is missing,
# init exits 1 ("could not load encryption key") and NO atuin hooks install —
# Ctrl+R silently falls back to zsh's search and nothing is recorded. Only
# `atuin register`/`atuin login` create that key, so on a sync-less machine
# generate one before enabling this:
#     openssl rand 32 | base64 -w0 > ~/.local/share/atuin/key
#     chmod 600 ~/.local/share/atuin/key
[dotfiles]
enabled = true
